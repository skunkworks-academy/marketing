name: Validate and deploy Marketing Academy public site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate public site and access gate
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f CNAME
          test -f assets/styles.css
          test -f assets/app.js
          test -f courses/marketing-fundamentals/index.html
          grep -q '<main id="main"' index.html
          grep -q 'marketing.skunkworksacademy.com' CNAME
          grep -q 'Enrolment required' courses/marketing-fundamentals/index.html
          grep -q 'portal.skunkworksacademy.com/login' courses/marketing-fundamentals/index.html
          grep -q 'portal.skunkworksacademy.com/register' courses/marketing-fundamentals/index.html

      - name: Assemble public-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html CNAME .nojekyll _site/
          cp -R assets content courses _site/

      - name: Prevent protected learning content from being published
        shell: bash
        run: |
          set -euo pipefail
          test ! -d _site/learn
          test ! -d _site/docs
          test ! -d _site/build
          if grep -RIl --exclude='index.html' -E 'Final knowledge assessment|Integrated practical assessment|Portfolio of Evidence' _site/courses/marketing-fundamentals; then
            echo 'Protected course material was detected in the public artifact.' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
