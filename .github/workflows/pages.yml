name: Build and deploy Marketing Academy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Marketing Fundamentals course
        run: npm run build

      - name: Validate static hub
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f CNAME
          test -f assets/styles.css
          test -f assets/app.js
          grep -q '<main id="main"' index.html
          grep -q 'marketing.skunkworksacademy.com' CNAME

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/courses/marketing-fundamentals
          cp -R build/. _site/courses/marketing-fundamentals/
          cp index.html CNAME .nojekyll _site/
          cp -R assets content _site/

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
