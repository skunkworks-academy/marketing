name: Validate and deploy Marketing Academy public site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate public site and access gate
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f CNAME
          test -f assets/styles.css
          test -f assets/app.js
          test -f courses/marketing-fundamentals/index.html
          grep -q '<main id="main"' index.html
          grep -q 'marketing.skunkworksacademy.com' CNAME
          grep -q 'Enrolment required' courses/marketing-fundamentals/index.html
          grep -q 'portal.skunkworksacademy.com/login' courses/marketing-fundamentals/index.html
          grep -q 'portal.skunkworksacademy.com/register' courses/marketing-fundamentals/index.html

      - name: Assemble public-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html CNAME .nojekyll _site/
          cp -R assets content courses _site/

      - name: Inject and verify Academy global shell on every published HTML document
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site')
          current = 'https://skunkworksacademy.com/assets/academy-navigation.js?v=2026.08.15.1'
          marker = 'data-skunkworks-global-nav="v10"'
          loader = f'<script defer src="{current}" {marker}></script>'
          old_tags = re.compile(r'<script\b[^>]*(?:academy-navigation\.js|data-skunkworks-global-nav|data-skunkworks-global-shell)[^>]*>\s*</script>', re.I)
          documents = []

          for path in root.rglob('*.html'):
              html = path.read_text(encoding='utf-8', errors='ignore')
              if not re.search(r'<!doctype\s+html|<html\b|<head\b|<body\b', html, re.I):
                  continue
              html = old_tags.sub('', html)
              if re.search(r'</head\s*>', html, re.I):
                  html = re.sub(r'</head\s*>', f'  {loader}\n</head>', html, count=1, flags=re.I)
              elif re.search(r'</body\s*>', html, re.I):
                  html = re.sub(r'</body\s*>', f'  {loader}\n</body>', html, count=1, flags=re.I)
              else:
                  raise SystemExit(f'Malformed HTML document cannot receive Academy shell: {path}')
              path.write_text(html, encoding='utf-8')
              documents.append(path)

          if not documents:
              raise SystemExit('Marketing artifact contains no HTML documents.')

          missing = []
          duplicate = []
          for path in documents:
              html = path.read_text(encoding='utf-8', errors='ignore')
              if current not in html or marker not in html:
                  missing.append(str(path))
              if html.count('academy-navigation.js') > 1:
                  duplicate.append(str(path))
          if missing:
              raise SystemExit('Missing Academy global shell: ' + ', '.join(missing))
          if duplicate:
              raise SystemExit('Duplicate Academy global shell: ' + ', '.join(duplicate))
          print(f'Verified Academy canonical v10 shell on {len(documents)} published HTML document(s).')
          PY

      - name: Prevent protected learning content from being published
        shell: bash
        run: |
          set -euo pipefail
          test ! -d _site/learn
          test ! -d _site/docs
          test ! -d _site/build
          if grep -RIl --exclude='index.html' -E 'Final knowledge assessment|Integrated practical assessment|Portfolio of Evidence' _site/courses/marketing-fundamentals; then
            echo 'Protected course material was detected in the public artifact.' >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
